name: Deploy to VPS
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd verification
          npm install
          npm run baseline
      - run: |
          .\scripts\deploy-vps.ps1
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}